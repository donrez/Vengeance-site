# ============================================================
# Sunless site — Nginx config (sites-available/default)
# Replace domain.com with your real domain!
# After editing: sudo nginx -t && sudo systemctl reload nginx
# SSL (optional but recommended): sudo certbot --nginx -d domain.com -d www.domain.com
# ============================================================

# Upload chunks are ~4.5MB — nginx default limit is 1MB
client_max_body_size 16m;

server {
    listen 80;
    listen [::]:80;
    server_name domain.com www.domain.com;

    # ---- Frontend (static files: index.html, assets/, fonts/) ----
    root /var/www/site;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    # ---- API -> backend on localhost:1000 ----
    location /api/ {
        proxy_pass http://127.0.0.1:1000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}