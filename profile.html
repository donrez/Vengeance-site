  <button type="button" data-lang="pl">PL</button>

<main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-10">

        <h1 class="text-2xl font-medium tracking-[-0.01em] text-white" data-i18n="profile.tab.info">Information</h1>
        <div class="w-full" id="profile-box" style="display:none">

          <div class="auth-ok"></div>

          <div class="profile-row">

          <div class="profile-row">

            <span id="p-device" class="mono">—</span>
          </div>

          <form id="hwid-form" style="margin-top:6px">

          <form id="key-form" style="margin-top:14px">
            <div class="w-full relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-round absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30 transition-colors duration-300 pointer-events-none" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>

            </div>
            <button type="submit" class="mt-2 w-full cursor-pointer flex items-center justify-center gap-2 px-5 py-2.5 rounded-[8px] bg-[var(--accent-color)] text-white border border-white/30 hover:opacity-80 transition-all duration-300 font-medium text-sm" data-i18n="profile.activateKey">Activate Key</button>
          </form>

          <button type="button" id="logout-btn" class="mt-3 w-full cursor-pointer flex items-center justify-center gap-2 px-5 py-2.5 rounded-[8px] border border-white/10 text-[#a8a8a870] hover:text-white hover:border-white/20 transition-all duration-300 font-medium text-sm" data-i18n="profile.logout.title">Logout</button>
        </div>
      </div>
    </div>
  </div>
