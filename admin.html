<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin — Vengeance</title>
  <link rel="icon" href="/favicon.ico"/>
  <link rel="stylesheet" href="/css/vesence.css?v=8"/>
  <link rel="stylesheet" href="/css/auth.css?v=2"/>
</head>
<body data-page="admin" class="geist_a71539c9-module__T19VSG__variable geist_mono_8d43a2aa-module__8Li5zG__variable antialiased bg-black" style="--accent-color:#a164dd;--color-pinkpink:#ffffff;--color-pinkpinkDark:#ffffff;--text-color:color-mix(in srgb, #a164dd 50%, white);--text-color-acc:#a164dd;--color-user-login:color-mix(in srgb, #a164dd 20%, white);--color-user-uid:color-mix(in srgb, #a164dd 60%, white);--color-home-title:color-mix(in srgb, #a164dd 40%, white);--color-home-text:color-mix(in srgb, #a164dd 40%, white);--color-welcome:color-mix(in srgb, #a164dd 45%, white);--color-takealook:color-mix(in srgb, #a164dd 10%, white);--color-tom-and-jerry:color-mix(in srgb, #a164dd 30%, rgba(255, 255, 255, 0.25));--color-all-rights:color-mix(in srgb, #a164dd 40%, rgba(255, 255, 255, 0.25))">
<div class="fixed inset-0 z-[-1] overflow-hidden"><div style="background-color:color-mix(in srgb, #d40f0f 3.5%, rgb(7, 7, 7));position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none"><div style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1"><canvas class="noise-overlay" style="image-rendering:pixelated"></canvas></div></div></div>

<header class="auth-topbar">
  <a href="/" class="auth-brand">Vengeance</a>
  <div class="auth-topbar-right">
    <a href="/" class="auth-home-link" data-i18n="nav.home">Home</a>
    <div class="auth-langs">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </div>
</header>

<main class="auth-wrap" style="align-items:flex-start">
  <!-- password gate -->
  <div class="auth-card" id="admin-gate" style="display:none">
    <h1 data-i18n="admin.fullPanel">Full Panel</h1>
    <p class="auth-sub">Vengeance</p>
    <div class="auth-error"></div>
    <form id="admin-form" novalidate>
      <div class="field">
        <label data-i18n="reg.placeholder.password">Password</label>
        <input id="admin-password" type="password" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-primary" data-i18n="admin.join">Join</button>
    </form>
  </div>

  <!-- panel -->
  <div class="admin-panel" id="admin-panel" style="display:none">
    <div class="admin-tabs">
      <button type="button" class="active" data-tab="keys" data-i18n="adminPanel.keys">Keys</button>
      <button type="button" data-tab="users" data-i18n="adminPanel.users">Users</button>
      <button type="button" id="admin-logout" data-i18n="profile.logout.title">Logout</button>
    </div>

    <div class="auth-error" id="admin-error"></div>

    <section id="tab-keys">
      <div class="admin-toolbar">
        <input id="key-count" type="number" min="1" max="100" value="5"/>
        <button type="button" id="btn-generate" class="btn-primary" data-i18n="admin.generateKeys">Generate keys</button>
        <button type="button" id="btn-copy" class="btn-ghost" data-i18n="admin.copyAll">Copy all</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th data-i18n="admin.keys">Keys</th>
              <th data-i18n="admin.keys.count">Count</th>
              <th data-i18n="adminPanel.users">Users</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="keys-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-users" style="display:none">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th data-i18n="reg.placeholder.username">Username</th>
              <th>Email</th>
              <th data-i18n="profile.subscription">Subscription</th>
              <th data-i18n="profile.hwid">Hwid</th>
              <th data-i18n="admin.hwidReset">HWID Reset</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="/js/dict.js?v=8"></script>
<script src="/js/admin.js?v=1"></script>
</body>
</html>
